name: "utils"

volumes:
  portainer_data:

services:
  # Gerenciador de container: UI para visualizar os containers
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - caddy
    labels:
      caddy: portainer.${HOME_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9000}}"
  # Teste de conexão na rede local
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${MEDIA_DATA_DIR}/librespeed:/config
    networks:
      - default
      - caddy
    labels:
      caddy: speed.${HOME_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
  # Atualizador de containers
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_RAW
      - SETUID
  # VPN - Zerotier ou Tailscale
  zerotier:
    image: zerotier/zerotier:latest
    container_name: myzerotier
    restart: unless-stopped
    volumes:
      - ${MEDIA_DATA_DIR}/zerotier:/var/lib/zerotier-one
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    network_mode: host

networks:
  caddy:
    external: true
